descriptive:
  no_readings: true
  cells: Every remaining arm x budget x design cell; all A1; descriptive budget; AUROC;
    top-fraction precision; per-round test results; mechanism; numerical noise.; every
    inner-selected A5; FT at n=10000 P draw 0 only, no F4 reading
  per_round: In S, re-evaluate retained replicate scores separately within each specified
    test round and variant; no additional fitting or winner selection.
  intervals: Same conditional cluster-bootstrap settings for descriptive AP/AUROC
    contrasts; no Holm and no readings. Precision, strata and numerical-noise diagnostics
    follow pinned source reporting; interval convention beyond source output requires
    specification before affected analysis.
  band_gap: Frozen predecessor confirmatory result carried over as a labelled historical
    record; no new analysis in this protocol.
  A2_A3_record: PILOT negative; cite CONFIRM delta record descriptively, no rerun.
  interval_comparators: Point/interval per retained method; checkpoint-specific methods
    versus their own R0; ensemble methods versus each fixed R0, labelled descriptive.
    AP/AUROC use paired draws; undefined AUROC counts reported. No readings.
