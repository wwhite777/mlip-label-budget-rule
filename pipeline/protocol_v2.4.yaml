inner:
  fraction: 0.2
  seed_offset: 7
  rule: 'v1.2 inner_split: sorted distinct draw chemical systems, default_rng(P.draw_fold_multiplier*f+r+seed_offset)
    permutation; take complete systems until cumulative count first reaches fraction*n.
    S uses f=S.inner_fold_index. Validation can exceed the fraction.'
  selection: Highest inner-validation AP for each learner separately; first grid point
    wins exact ties; refit on all n drawn labels. No outer labels in selection, standardization
    or prior estimation.
  single_class: 'Exact arms binary_select fallback: if inner fit or validation is
    single-class, first grid for each type without grid evaluation; inner diagnostic
    equals validation prevalence. If full draw single-class, constant class score;
    else refit first grid on full draw. No redraw. C1 always tunes by AP and first-grid
    ties, including all-zero validation AP. Empty inner split is a hard error.'
  empty_split: STOP; amendment required before retry, no redraw
  scope: Shared draw-system split. AP grid selection applies only to inner-selected
    CPU arms; A5f has no selection; FT uses strict validation per-atom MSE with epoch
    zero selectable.
