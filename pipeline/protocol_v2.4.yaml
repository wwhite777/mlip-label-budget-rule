    checkpoint per phase; exactly selected epochs on all draw IDs; no scheduler/replay;
    float32-highest
  e0: foundation
  optimizer: AdamW
  epoch0_selectable: true
  train_geometry: relaxed
  variant: full
training_data_overlap:
  mace_medium:
    declared_training_sets:
    - MPtrj
    membership: UNVERIFIED exact checkpoint roster and WBM structure/prototype overlap
  chgnet:
    declared_training_sets:
    - MPtrj
    membership: UNVERIFIED exact checkpoint roster and WBM structure/prototype overlap
  sevenn:
    declared_training_sets:
