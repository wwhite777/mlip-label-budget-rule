id: stability_label_budget_v2.4
contract: pipeline/CONTRACT_v2.4.md
status: Fixed scientific specification
issued_date: '2026-10-22'
claim:
  purpose: DECISION
  scope: 'Five specified checkpoints and tested discrete budgets only; no continuous
    threshold or below/above-budget claim. FT has F4; A1 is descriptive. F1/F2: confirmatory,
    exposure-informed; not independent confirmations of an unseen population.'
  attribution_limit: F1 evaluates the combined pipeline; it does not isolate an encoder-feature
    contribution beyond A4/ENS.
  low_budget_threat: A5f at n<=1000 was never run on PILOT; its high-budget-fixed
    point is untuned at low budgets, which can ease a negative F2 reading.
  statement: 'For the five frozen draws, conditional on fitted models, the exposure-informed
    claim is: at the tested label budgets of 300 and 1,000, the frozen correction
    set of F2 does not exceed the strongest measured zero-shot comparator by the practical
    margin; at 10,000, at least one A5f tree head on frozen features plus zero-shot
    hull distances adds beyond that margin. The 3,000-label result and mechanism are
    reported separately. A1-equivalent residual heads nested in A5f inputs were already
    seen on CONFIRM.'
