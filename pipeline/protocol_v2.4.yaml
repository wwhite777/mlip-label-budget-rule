    membership: UNVERIFIED exact checkpoint roster and WBM structure/prototype overlap
  interpretation: Checkpoint identity does not establish training-set membership.
    The ORB declarations differ in scope; no WBM overlap control or checkpoint-specific
    exclusion is established.
execution:
  active_F4: true
  C05_resolution: All five fixed A5f sources PASS the specified PILOT numerical-stability
    criterion. A failed or missing source makes all F1/F2 readings descriptive, retaining
    the complete family and source set.
  C05_A5f_verdicts:
    mace_medium: PASS
    chgnet: PASS
    sevenn: PASS
    mattersim_5m: PASS
    orb: PASS
  execution_order:
  - CPU-P
  - judge
  - CPU-S
  - FT-P
  - FT-S
  - mechanism
  metadata_allowlist:
  - material_id
  - formula
  - unique_prototype
  - n_sites
  optional_CPU_P_failures: Failed or unavailable F3/ancillary CPU-P units are logged
    explicitly, without partial F3 readings; complete F1/F2 still determine success.
    Required F1/F2 unit or population failures stop their judgment. No specification,
    input or family size changes.
  stage_chain: Each completed stage binds earlier stage manifests and all output hashes
    locally. The mechanism stage may use terminal INCOMPLETE_CAP fine-tuning stages;
    missing F4 cells receive no reading.
timing_statement: The protocol was fixed before the evaluation population was scored
  for these methods; earlier related results on the same population are listed in
  the exposure table.
amendment_A2:
  title: 'Amendment A2: relaxed-reference extension'
  version: '2.4'
  scope: 'Additive only: the v2.3.1 specification, readings and decision rule stand
    unchanged. The extension has a separate judge.'
  arms:
    A5fR:
      sources:
      - mace_medium
      - chgnet
      - sevenn
      - mattersim_5m
      - orb
      inputs:
      - frozen source encoder features cast float64
      - five relaxed hull distances
      model: hist_gbm
      learning_rate: 0.05
      max_leaf_nodes: 31
      max_iter: 300
      early_stopping: false
      random_state: 0
      fit: all n drawn labels
      inner_selection: false
    A4R:
      inputs:
      - five relaxed hull distances
      - composition fractions
      model: hist_gbm
      learning_rate:
      - 0.05
      - 0.1
      max_leaf_nodes:
      - 15
      - 31
      max_iter: 300
      early_stopping: false
      random_state: 0
      selection: unchanged binary_select; shared inner split; first exact tie; refit
        all n
    ENS-R:
      inputs:
      - five relaxed hull distances
      score: negative strict arithmetic mean
      label_free: true
    A5fRS:
      inputs:
      - frozen source encoder features cast float64
      - five single-point hull distances
      - five relaxed hull distances
      sources:
      - mace_medium
      - chgnet
      - sevenn
      - mattersim_5m
      - orb
      head: same fixed A5fR head
      role: descriptive only; excluded from F5, F6 and extension rule
  comparator:
    scores:
    - R0_mace_medium
    - R0_chgnet
    - R0_sevenn
    - R0_mattersim_5m
    - R0_orb
    - R0R_mace_medium
    - R0R_chgnet
    - R0R_sevenn
    - R0R_mattersim_5m
    - R0R_orb
    - ENS
    - ENS-R
    count: 12
    maximum: maximum of replicate-mean AP, recomputed after aggregation in every bootstrap
    ENS: negative arithmetic mean of five single-point hull distances
    ADDS: 'intersection-union: max of twelve component upward p-values, then family
      Holm'
    fixed_down_reference: R0R_orb
    fixed_down_reason: relaxed ORB selected as best label-free score on PILOT before
      new CONFIRM evaluation; fixed across all designs and bootstraps; sufficient
      condition for strongest label-free comparator
  families:
    F5:
      n: 10000
      size: 6
      arms:
      - A5fR_mace_medium
      - A5fR_chgnet
      - A5fR_sevenn
      - A5fR_mattersim_5m
      - A5fR_orb
      - A4R
      up: IUT over twelve references then Holm; ADDS
      down: fixed relaxed ORB then Holm; DOES_NOT_EXCEED
    F6:
      budgets:
      - 300
      - 1000
      - 3000
      size: 3
      contenders:
      - A5fR_mace_medium
      - A5fR_chgnet
      - A5fR_sevenn
      - A5fR_mattersim_5m
      - A5fR_orb
      - A4R
      - ENS-R
      up: descriptive only
      down: contender maximum minus fixed relaxed ORB then Holm; DOES_NOT_EXCEED
  extension_rule:
    design: P
    conjunction: true
    low_family: F6
    low_budgets_required:
    - 300
    - 1000
    low_required_reading: DOES_NOT_EXCEED
    high_family: F5
    high_arms:
    - A5fR
    high_required_reading: ADDS
    high_min_contrasts: 1
    budget_3000_in_rule: false
    interpretation: relax, then correct, scoped to the specified F6 contender set
  designs:
    P: primary; same five frozen outer folds, draws and inner splits
    S_a: secondary; same frozen campaign draws, inner splits and S-a test set
    S_b: secondary; same fitted models as S-a; fixed S-b subset
  budgets:
  - 300
  - 1000
  - 3000
  - 10000
  replicates:
  - 0
  - 1
  - 2
  - 3
  - 4
  inference:
    margin_AP: 0.02
    B: 2000
    seed: 20261022
    seed_restart: per evaluation design P, S-a, S-b
    alpha: 0.05
    coverage: 0.9
    percentiles:
    - 5
    - 95
    p_up: '(1 + #{d* <= m}) / (B + 1)'
    p_down: '(1 + #{d* >= m}) / (B + 1)'
    multiplicity: separate directional Holm within family and design; no global FWER
      claim
    bootstrap: unchanged paired chemical-system cluster weights; M*=mean_r weighted
      AP_r; no refitting
    uncertainty: conditional on fitted models and five frozen draws; percentile bands
      for maxima descriptive, not calibrated confidence intervals; report draw sample
      SD
  scoring: unchanged sklearn 1.7.2 AP; P pooled out-of-fold AP per draw, then mean;
    S test AP per draw, then mean; AUROC and per-fold-ceil top-5 percent precision
    descriptive
  missing:
    trees: NaN into HistGBM, no imputation or dropping
    label_free: missing ranks last, ties below every available score
    ensemble: strict five-source mean; any missing source makes ENS-R missing
    infinity: hard error
    labels: nonfinite labels hard stop
  development_choices:
    fixed_head: The fixed A5f head was selected on reused PILOT and retained without
      new tuning.
    fixed_reference: relaxed ORB selected on PILOT as best label-free score
    F6_set: 'Development choice: RR/C1 re-references single-point formation energies;
      no relaxed analogue was developed on PILOT. Seven rather than twelve contenders
      can ease DNE; relax, then correct is scoped to this set, fixed before relaxed-arm
      results.'
    report_comparator: Use twelve-score LF_max. The earlier six-score relaxed oracle
      was equal on PILOT only.
    source: PILOT only; no claim of independent development validation
  interpretive_limits:
    attribution: F5 does not isolate encoder-feature attribution beyond A4R/ENS-R;
      no confirmatory contrast against A4R.
    low_budget: Fixed high-budget head is untuned at 300/1000; this can ease the required
      DNE leg.
    informative_leg: PILOT suggests the low leg; F5 at 10000 is the informative leg.
      Reused PILOT increments may not transfer.
  exposure:
    wording: confirmatory, exposure-informed
    relaxed_references: Evaluation performance of the relaxed references was previously
      seen in the earlier study and its follow-up analysis.
    new_arms: A5fR, A4R, ENS-R and A5fRS have never touched CONFIRM labels before
      this amendment
    question: Post hoc question prompted by earlier evaluation results; the tests
      were specified before the new relaxed correction arms were evaluated.
    known_reference_values: AP and top-5 percent precision were inspected in P, S-a
      and S-b; reference values are not new results.
    known_ORB_rank: 'Relaxed ORB rank was known when fixed: primary AP 0.9349424282920303
      versus MatterSim 0.9182220284944321.'
    known_predecessor: v2.3.1 CONFIRM A5f/A4/E0 outcomes at every budget and the met
      rule were known at design time.
    frozen_refit: Two frozen-arm units were refit using 10,941 evaluation-population
      training labels, without evaluation-label parsing or evaluation.
    checkpoint_identity: Released relaxed-prediction checkpoint identity with frozen
      encoders is assumed, not proven.
    qualification: Confirmatory, exposure-informed; not independent confirmation on
      globally unseen CONFIRM. All constants and the rule inherited from predecessor
      freeze.
  C05:
    criterion: 'unchanged specified choice: max_seed abs(pooled AP_seed - pooled AP_0)
      <= 0.005'
    part: PILOT
    design: P
    n: 10000
    draw: 0
    seeds:
    - 0
    - 1
    - 2
    relative_gaussian_scale: 1.0e-07
    feature_dtype: float32
    hull_dtype: float64
    composition_unchanged: true
    perturbation_order: all five full feature arrays in frozen source order, then
      row-major relaxed hull matrix
    sources:
    - mace_medium
    - chgnet
    - sevenn
    - mattersim_5m
    - orb
    A4R_required: true
    verdicts:
      mace_medium: PASS
      chgnet: PASS
      sevenn: PASS
      mattersim_5m: PASS
      orb: PASS
    A4R_verdict: PASS
    failure: 'missing check blocks freeze; any FAIL makes all F5/F6 descriptive, no
      deletion or resizing; current all-PASS schema cannot authorize failed-C05 evidence:
      a newly reviewed schema/document and evidence binding is required'
  environment:
    python: Python 3.10.12; requirements-cpu.txt
    device: CPU
    max_threads: 12
    compute_workers: 10
    native_threads_per_worker: 1
    packages:
      numpy: 2.2.6
      pandas: 2.3.3
      scikit-learn: 1.7.2
      scipy: 1.15.3
      pyyaml: 6.0.3
      threadpoolctl: 3.7.0
      joblib: 1.6.0
      pytest: 9.1.1
  stage:
    name: CPU-R
    after: mechanism
    existing_outputs: Read only; separate extension output root
    integrity: Published specifications and code, then the complete local predecessor
      chain, checked before labels
    original_predecessor_sha256:
