  R0:
    score: -hhat_k
    labels: none
  R0_star:
    definition: max_k AP(R0_k) on the same evaluation population; deterministic references
      have identical replicate metrics; recompute the maximum for every bootstrap
      draw, never freeze the observed winner
    deployable_model: false
    name: the strongest measured zero-shot comparator
    interpretation: Evaluation-label oracle over five fixed references; not a deployable
      selection rule. Matched-checkpoint F3/F4 are separate.
  E0:
    score: -mean_k(hhat_k)
    labels: none
    disambiguation: E0 ensemble arm differs from elemental atomic E0 offsets in FT;
      neither median nor probability averaging is the named ensemble.
    prose_name: ENS
  C1:
    objective: sum((f_DFT-e_form_pred_sp-b-c@delta)^2)+alpha*sum(delta^2)
    score: -(hhat_k+b+c@delta)
    hull: fixed; retain fold intercepts when pooling
    model: models.c1
    prose_name: RR; distinct from predecessor C1 membership association
  A4:
    X: '[hhat_all,c]'
    model: hist_gbm
    selection: HistGBM only for confirmatory contrasts; logistic and best menu outputs
      are descriptive; composition is present in the code tree variant.
  A5:
    X: '[float64(F_k),hhat_all]'
    model: hist_gbm
    score: predict_proba(stable)
    role: DESCRIPTIVE everywhere; inner-selected HistGBM retained.
  A1:
    X: '[float64(F_k),hhat_k]'
    models:
    - logistic
    - hist_gbm
    - best
    role: DESCRIPTIVE in every cell, no readings
  FT:
    variant: full
    geometry: relaxed
    e0: foundation
    epoch0: foundation checkpoint; selectable; E0 frozen and excluded from AdamW
    seed_rule: 1000*fold+draw (P); 1000*5+draw (S)
    seed_fold_multiplier: 1000
    seed_S_fold: 5
    scoring: INITIAL geometry, MP2020 once, rounded elemental references, fixed MP
      hull derived from pinned reference predictions; no test labels in training or
      energy conversion
    selection: strict inner-validation per-atom MSE improvement including epoch 0;
      fresh foundation refit on all draw IDs for exactly selected epochs
    development_ref: exposure.FT
    target: raw relaxed CSE DFT total energy; only drawn training IDs through verified
      freeze guard
    recipe_ref: ft_recipe
  other_cells: Any emitted cell outside the exact family definitions is descriptive,
    including A2/A3, A4 logistic/best and E0 median; no added run is authorized just
    by this catch-all.
  A5f:
    X: '[float64(F_k),hhat_all]'
    model: hist_gbm
    selection: none; one fit on all n draw labels
    fixed_params:
      learning_rate: 0.05
      max_leaf_nodes: 31
    defaults_ref: models.hist_gbm
    role: confirmatory in exact F1/F2 cells
    development_ref: exposure.A5f
    fixed_setting:
      path: src/fixed_head/fixed_setting.json
      sha256: f1fecde115b903268aee68ff2eeda95fe84ff5d23be46060614b2cee463efe8b
metrics:
  primary: sklearn.metrics.average_precision_score
  sklearn_version: 1.7.2
  weighting: structure, step-wise AP
  P: For each r, pool scores of its held-out outer-fold pipelines over the full CONFIRM
    population; M_r=AP(y,s_r); M=mean_r(M_r). Never mean fold AP or replicate scores.
  S: For each r, AP on the fixed variant test population; M=mean_r(M_r). No outer-fold
    averaging or synthetic five-fold pooling in S.
  report: Every AP has structure count, positive count and prevalence; retain scores,
    IDs, replicate, fold, draw, inner split, selected parameters and flags.
  top_fraction: 0.05
  precision: 'Descriptive; ceil(top_fraction*N) for every new analysis. P learners:
    per fold then pooled hits/selected; S: per variant test set; mechanism: per reporting
    population. Score-descending/material_id-ascending ties.'
  half_round: 0.5
  missing: Nonfinite labels hard error as predecessor. arms requires complete finite
    five-reference and feature coverage; do not drop or impute silently. Broader predecessor
    intersection sensitivities are not the primary v2 population.
  half_round_role: Legacy inactive provenance only; no new analysis uses it.
  label_finiteness: Check all requested labels at run start, after verified freeze;
    STOP on any nonfinite value, no fallback/intersection.
inference:
  B: 2000
  seed: 20261022
  coverage: 0.9
  percentiles:
  - 5
  - 95
  alpha: 0.05
  bootstrap: Paired chemical-system cluster, conditional on fitted models. Sort evaluation
    systems; fresh default_rng(seed) per design; draw as many systems with replacement
    as present; carry all structures and every arm/replicate score with cluster multiplicities.
    P resamples all CONFIRM systems; S resamples test systems only; no refitting or
    resampling training labels.
  recompute: Recompute all weighted M_r then M, oracle R0_star (for reporting) and
    F2 contender maximum after replicate aggregation. F1 up component tests and F1/F2
    down fixed-ORB tests never subtract a resampled reference maximum.
  p_up: '(1 + #{d* <= m}) / (B + 1)'
  p_down: '(1 + #{d* >= m}) / (B + 1)'
  up_null: d <= m
  down_null: d >= m
  interval: Unadjusted two-sided nominal percentile summary; numpy.percentile linear;
    interval does not determine reading.
  percentile_band_qualification: Oracle and contender-maximum percentile bands are
    descriptive, nominal percentile summaries; their coverage can be poor at ties
    and they must not be presented as calibrated 90 % confidence intervals.
  multiplicity: Separate directional Holm families within each family AND design.
    No pooling across directions, designs or families; no global familywise error
    claim. Holm ties by contrast name.
  readings:
    ADDS: 'F1: Holm-adjusted max_k p_up,k <= alpha; F3/F4: ordinary matched-reference
      Holm up. F2 up is descriptive only.'
    DOES_NOT_EXCEED: 'down Holm-adjusted p <= alpha: increment below +m, not zero
      benefit'
    otherwise: INCONCLUSIVE
  invalid: Nonfinite bootstrap contrasts stop readings. Undefined descriptive AUROC
    draws are omitted with counts; this omission rule is new in v2.3, not inherited
    from v1.2.
  fixed_down_reference: R0_orb
  fixed_reference_selection: ORB v3, best PILOT design-P reference; fixed before CONFIRM;
    never reselected per design or bootstrap.
  F1_up: 'IUT: p_IUT=max_k p_up(M(arm)-M(R0_k)); apply family Holm to these per-contrast
    p-values.'
  F1_F2_down: Test against fixed R0_orb, a sufficient condition for the strongest
    measured zero-shot comparator; F2 keeps the contender maximum.
  F2_up: DESCRIPTIVE ONLY; no confirmatory ADDS reading from the contender maximum.
  down_reporting: Every DOES_NOT_EXCEED reading is reported with its down_estimate
    and down_interval against fixed ORB; the oracle estimate is labelled descriptive.
  calibration_regression_scope: 'The original family rates used identical contrasts.
    When the other contrasts are clearly rejected, the family error equals the scalar
    tail: approximately 0.056 at N = 1,000 and approximately 0.051 at N = 59,319 in
    the binary construction. The gate checks reproduced fixture values +/- Monte Carlo
    tolerance as a regression check; it does not assert family-level error control.'
  draw_spread: Report sample SD (ddof=1) of M_r next to every reading, with reference
    SD and contrast-draw SD; fixed point-estimate winners for maxima. Training draw/refit
    variability is not included in cluster intervals.
margin:
  AP: 0.02
  common: true
  rationale_v1_2: below about 2 points of average precision a practitioner would not
    change pipelines given the cost of 3,000 DFT labels
  scope: Common fixed 0.02 AP at every tested budget; no budget-specific tuning or
    continuous-threshold claim.
  rationale_by_budget:
    n300: A minimal label purchase warrants a gain large enough to change the screening
      pipeline; the same practical AP floor avoids treating tiny cheap-budget shifts
      as useful.
    n1000: An intermediate label purchase still requires the same pipeline-changing
      AP gain, rather than a smaller significance-driven threshold.
    n3000: This is the historical reference cost underlying the practical AP floor;
      it is reported separately and cannot rescue success.
    n10000: The largest label investment must clear at least the same practical AP
      floor; the high-budget F1 test is the informative part of the success conjunction.
  information: Low-budget DOES_NOT_EXCEED was expected from PILOT for related controls;
    it is weak additional evidence. A5f itself was never run at n<=1000 on PILOT,
    so this expectation does not guarantee success. F1 at 10000 is the informative
    test.
families:
  designs:
  - P
  - S-a
  - S-b
  F1:
    n: 10000
    size: 6
    directions:
    - up
    - down
    contrasts: M(A5f_k)-M(R0_star) for every backbone, plus M(A4 hist_gbm)-M(R0_star)
    contrast_specs:
    - arm: A5f
      model: hist_gbm
      checkpoint_ref: backbones.order
      reference: R0_star
    - arm: A4
      model: hist_gbm
      checkpoint: ensemble
      reference: R0_star
    role: confirmatory, exposure-informed; descriptive if any C05 A5f source FAIL
      or missing
    up_test: IUT max component p, followed by six-contrast family Holm
    down_test: fixed R0_orb sufficient condition, followed by six-contrast family
      Holm
  F2:
    budgets:
    - 300
    - 1000
    - 3000
    size: 3
    contenders_n: 12
    directions:
    - down
    - up
    contenders:
    - A5f_mace_medium
    - A5f_chgnet
    - A5f_sevenn
    - A5f_mattersim_5m
    - A5f_orb
    - A4_hist_gbm
    - C1_mace_medium
    - C1_chgnet
    - C1_sevenn
    - C1_mattersim_5m
    - C1_orb
    - E0_mean
    contrast: d_max(n)=max_a M(a,n)-M(R0_star)
    bootstrap: Maximum of contender replicate-mean APs, minus fixed R0_orb for down
      tests. Report oracle difference separately; oracle-maximum up tails are descriptive
      only.
    exclusions:
    - A1
    - FT
    - A2
    - A3
    - A5
    operator: maximum_over_replicate_mean_AP_then_subtract_fixed_R0_orb_for_down
