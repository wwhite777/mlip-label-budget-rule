  - C1
  - E0
  - FT
  A1: A1-equivalent residual heads had prior CONFIRM exposure and are DESCRIPTIVE
    in every design, checkpoint and budget, including ORB and campaign variants.
  known_record: Earlier evaluation included A1-equivalent residual heads, frozen-head
    budget sweeps, delta analyses, and mechanism/feature controls. The evaluation
    population was previously used for related results.
  g001: Flawed raw-total E0 replacement; retained provenance, excluded as a tested
    FT arm.
  g002: Residual E0, relaxed-geometry pilot seen; no confirmatory FT choice inferred
    from it.
  g003: Completed residual-E0 initial-geometry PILOT G003 (); below zero-shot; G004
    foundation-E0 relaxed variant chosen in .
  wording: F1/F2 are confirmatory, exposure-informed comparisons, conditional on five
    fixed label draws and fitted models.
  g004: Completed foundation-E0 relaxed PILOT G004 (); development choice stated explicitly.
  A5: inner-selected A5 DESCRIPTIVE in every design after numerical instability on
    PILOT.
  A5f: fixed modal point chosen on reused PILOT selections; mildly optimistic PILOT
    performance. A1-equivalent inputs nested within A5f were seen on CONFIRM; new
    combined A5f itself not previously run.
  FT: G004 chosen among G002-G004 on PILOT; G001 void. No tested valid pilot recipe
    exceeded zero-shot.
  new_confirmatory_arms_note: New combinations/recipes; this does not assert independence
    from prior CONFIRM exposure or that ORB was unseen.
  ORB: ORB had evaluation outcomes at all four scheduled budgets. Exact combined A5f,
    A4, ENS, RR and full fine-tuning recipes had no recorded prior outcomes.
  record_limit: Some original residual-fit outputs are unavailable; the table distinguishes
    retained outcomes from scope reconstructed from the fixed specification and export
